[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
modelmark = "modelmark.modelmark:run"

[project]
name = "modelmark"
version = "0.1.0"
description = "Benchmark framework for neural network models"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [
    { name = "Andrew Larin" }
]

dependencies = [
    "numpy",
    "pandas",
	"torch",
	"tqdm",
	"playwright",
	"rich"
]

[tool.setuptools.packages.find]
where = ["src"]